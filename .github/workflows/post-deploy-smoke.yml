name: Post Deploy Smoke

on:
  workflow_run:
    workflows:
      - Deploy Pages
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke-check published page
        id: smoke
        env:
          PROD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          max_attempts=8
          attempt=1
          success=0
          while [ "$attempt" -le "$max_attempts" ]; do
            if curl --fail --silent --show-error --location "$PROD_URL" --output page.html \
              && grep -q "AuMonitor" page.html \
              && grep -q "id=\"root\"" page.html; then
              success=1
              break
            fi
            echo "Smoke attempt ${attempt}/${max_attempts} failed, retrying in 15s..."
            sleep 15
            attempt=$((attempt + 1))
          done

          if [ "$success" -ne 1 ]; then
            echo "Smoke check failed after ${max_attempts} attempts."
            exit 1
          fi

      - name: Create issue on smoke failure
        if: ${{ failure() }}
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = context.payload.workflow_run?.html_url || 'N/A'
            const prodUrl = `https://${context.repo.owner}.github.io/${context.payload.repository.name}/`
            const title = `Post-deploy smoke failed (${new Date().toISOString()})`
            const body = [
              'Automated post-deploy smoke check failed.',
              '',
              `- Production URL: ${prodUrl}`,
              `- Deploy run: ${runUrl}`,
              '',
              'Please verify GitHub Pages deployment and runtime availability.'
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            })
